<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CyberFX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #05070d;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #00e5ff;
        }

        .card {
            background: #0b101c;
            border: 1px solid #172033;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8f9aae;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #dce2ed;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #080d17;
            border: 1px solid #26334a;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: #00e5ff;
            color: #05070d;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #0b2b25;
            color: #56f0c5;
            border: 1px solid #176653;
        }

        .error {
            display: block;
            background: #2b1014;
            color: #ff7373;
            border: 1px solid #6b242c;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            color: #8f9aae;
            font-size: 14px;
        }

        .links a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #8f9aae;
            text-decoration: none;
            font-size: 14px;
        }

        .back a:hover {
            color: #00e5ff;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Cyber<span>FX</span>
        </div>

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CyberFX account
            </p>

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="button"
                >
                    Login
                </button>

            </form>

            <div
                id="message"
                class="message"
            ></div>

            <div class="links">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </div>

        </div>

        <div class="back">
            <a href="index.html">
                ← Back to CyberFX
            </a>
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                const savedUser =
                    localStorage.getItem("cyberfxUser");


                if (!savedUser) {

                    message.textContent =
                        "No account found. Please register first.";

                    message.className =
                        "message error";

                    return;
                }


                const user =
                    JSON.parse(savedUser);


                if (
                    email !== user.email ||
                    password !== user.password
                ) {

                    message.textContent =
                        "Incorrect email or password.";

                    message.className =
                        "message error";

                    return;
                }


                localStorage.setItem(
                    "cyberfxLoggedIn",
                    "true"
                );


                message.textContent =
                    "Login successful!";

                message.className =
                    "message success";


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 800);

            });

    </script>

</body>
</html>
