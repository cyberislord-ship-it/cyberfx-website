<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberFX Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #05070d;
            color: white;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #0b101c;
            border: 1px solid #172033;
            border-radius: 14px;
            padding: 35px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #00e5ff;
        }

        .subtitle {
            text-align: center;
            color: #7f899d;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #080d18;
            color: white;
            border: 1px solid #202a3d;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #00e5ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #05070d;
            font-weight: bold;
            cursor: pointer;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #7f899d;
            font-size: 14px;
        }

        .register a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7f899d;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            Cyber<span>FX</span>
        </div>

        <div class="subtitle">
            Login to your CyberFX account
        </div>

        <form>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

        <a href="index.html" class="back">
            ← Back to CyberFX
        </a>

    </div>

</body>
</html>
